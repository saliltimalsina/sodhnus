[project]
name = "sodhnus-ingest"
version = "0.1.0"
description = "Crawls official .gov.np websites into the Sodhnus database"
authors = [
    { name = "saliltimalsina", email = "salil.ragani@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
sodhnus-ingest = "sodhnus_ingest:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
